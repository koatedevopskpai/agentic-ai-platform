[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-platform"
version = "1.0.0"
description = "Agentic AI Workflow Platform — Multi-Agent System with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.4",
    "langchain-chroma>=1.0",
    "langgraph>=1.0",
    "chromadb>=1.5",
    "openai>=1.6",
    "pandas>=2.0",
    "plotly>=5.20",
    "streamlit>=1.35",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
# `where = ["."]` with `include = ["src*"]` installs the `src` package that the
# app and tests already import (`from src.main import create_app`). Previously
# `where = ["src"]` looked for packages *inside* src/, so `include = ["src*"]`
# matched nothing and `pip install .` produced a distribution containing no code.
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
